name: Iteration integration review

on:
  push:
    branches:
      - fix/iteration2-backend-review-20260914
      - fix/standalone-cleanup-ai-prod-20260914
      - iteration3
  pull_request:
    branches:
      - main
      - iteration-2-dev
      - iteration3

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actual-project/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: actual-project/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_api.py tests/test_beach_snapshots.py tests/test_active_composition.py tests/test_standalone_cleanup.py tests/test_manual_remarks.py tests/test_litter_gallery.py tests/test_final_band_contract.py tests/test_review_small_legacy.py tests/test_report_updates.py tests/test_yolo_runtime.py tests/test_recommendations.py tests/test_wildlife.py tests/test_species_model_upgrade.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actual-project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: actual-project/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
