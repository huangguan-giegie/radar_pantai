services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: radar-sampah:gcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RADAR_ENV: production
      PORT: "5000"
      TRUST_PROXY_HEADERS: "1"
      LITTER_PRELOAD: "true"
      # Reduce idle database connections without reducing Gunicorn's 4 threads.
      RADAR_DB_POOL_SIZE: "2"
      RADAR_DB_MAX_OVERFLOW: "2"
      # Opt-in ONNX experiment: set to 1 in the private production .env.
      RADAR_ONNX_LOW_MEMORY: "${RADAR_ONNX_LOW_MEMORY:-0}"
      # Bound glibc and BLAS worker allocations on the 1 GiB VM.
      MALLOC_ARENA_MAX: "2"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      EVENT_SCHEDULER_TTL_SECONDS: "60"
      INSIGHTS_CACHE_TTL_SECONDS: "60"
      RADAR_PREWARM_PUBLIC_VIEWS: "1"
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"
      interval: 30s
      timeout: 6s
      start_period: 150s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
